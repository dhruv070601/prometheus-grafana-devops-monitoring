name: Validate Monitoring Configuration

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus YAML
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import pathlib, yaml
          yaml.safe_load(pathlib.Path('prometheus/prometheus.yml').read_text())
          print('Prometheus configuration YAML is valid')
          PY
